#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "galette"
name = "Galette"
description.en = "Membership management web application for non profit organizations"
description.fr = "Outil de gestion d'adhérents et de cotisation en ligne pour associations"

version = "1.3.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-or-later"
website = "https://www.galette.eu"
demo = "https://demo.galette.eu/login"
admindoc = "https://doc.galette.eu/fr/master/"
code = "https://github.com/galette/galette"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/galette"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]
    [resources.sources.main]
    url = "https://github.com/galette/galette/archive/refs/tags/1.3.0.tar.gz"
    sha256 = "3c76d1fe2fb619fe5c24e52c5aadce3522bbdac70e091851303a6220e21857dc"

    autoupdate.strategy = "latest_github_tag"
    autoupdate.needs_manual_tweaks = true

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql, php8.5-tidy, php8.5-intl, php8.5-mbstring, php8.5-xml, php8.5-gd, php8.5-curl, php8.5-pgsql"

    [resources.database]
    type = "postgresql"
